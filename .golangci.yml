version: "2"

# Report every finding, not just the first few per kind — the defaults
# (max-issues-per-linter: 50, max-same-issues: 3) can hide repeat offenders.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # Default set (errcheck, govet, ineffassign, staticcheck, unused) plus a few
  # high-signal extras. staticcheck in v2 already folds in gosimple/stylecheck.
  enable:
    - bodyclose
    - misspell
  exclusions:
    # `db/sqlc` is generated by sqlc; routeTree etc. live on the web side.
    paths:
      - internal/db/sqlc/

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/db/sqlc/
